<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إدارة طابوني">
<title>إدارة طابوني برو</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--s1:#161411;--s2:#1e1a15;--line:#352d23;--line2:#4a3c2b;--text:#f8f5ef;--muted:#a99d8e;--gold:#e4af55;--gold2:#f3c879;--red:#e0302a;--green:#3fb96b;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
/* top bar */
.top{position:sticky;top:0;z-index:20;padding-top:var(--safe-t);background:rgba(12,11,9,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #241e17}
.top .wrap{height:60px;display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;border-radius:50%}
.top h1{font-size:17px;margin:0;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:10.5px;color:var(--gold);font-weight:800;letter-spacing:1px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#17130f;display:grid;place-items:center;font-size:17px;flex:none}
main{padding:14px 0 calc(96px + var(--safe-b))}
/* tabbar */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;padding-bottom:var(--safe-b);background:rgba(16,14,12,.95);backdrop-filter:blur(18px);border-top:1px solid #2a231b}
.tabs nav{max-width:560px;margin:0 auto;height:64px;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:800;color:#8f8476}
.tab b{font-size:20px;line-height:1}
.tab.on{color:var(--gold2)}
/* save bar */
.savebar{position:fixed;inset-inline:0;bottom:0;z-index:21;padding:10px 14px calc(10px + var(--safe-b));background:rgba(16,14,12,.96);backdrop-filter:blur(18px);border-top:1px solid #3a2e20}
.savebar .wrap{display:flex;gap:10px;padding:0}
.savebar.wt{bottom:calc(64px + var(--safe-b));padding-bottom:10px;border-bottom:1px solid #2a231b}
body.two-bars main{padding-bottom:calc(160px + var(--safe-b))}
/* cards & fields */
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:600;color:var(--muted);font-size:12px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.8;margin:6px 0 0}
label.f{display:block;margin-top:12px}
label.f:first-of-type{margin-top:0}
label.f>span{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#e2d6c6}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=url],input[type=email],textarea,select{width:100%;border:1px solid var(--line2);background:#110f0c;border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:84px;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:13px;padding:12px 18px;font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.gold{background:linear-gradient(135deg,#f4cb7d,#d89e45);color:#211508}
.dark{background:#241e18;border:1px solid var(--line2)}
.danger{background:#2a1513;border:1px solid #6b2a24;color:#ff9b91}
.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line2);border-radius:12px;padding:10px;font-weight:800;font-size:14px;background:#14110e}
.seg button.on{border-color:var(--gold);background:#2c2015;color:var(--gold2)}
/* product list */
.plist{display:grid;gap:8px}
.pi{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:9px;text-align:start;width:100%}
.pi img,.pi .noimg{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:none;background:#221b14}
.pi .t{flex:1;min-width:0}
.pi b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:900;border-radius:7px;padding:1px 8px}
.b-on{background:#173a24;color:#7fe0a0}
.b-off{background:#3a2a17;color:#f0c47d}
.b-feat{background:#2b2116;color:var(--gold2)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:32px;height:28px;border-radius:8px;border:1px solid var(--line2);background:#1b1612;font-size:13px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.head h2{margin:0;font-size:19px}
/* rich text */
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line2);border-bottom:0;border-radius:12px 12px 0 0;background:#1a1612}
.tb button{min-width:38px;height:36px;border-radius:9px;background:#261f18;border:1px solid #3d3124;font-weight:900;font-size:14px;padding:0 9px}
.tb button:active{background:#3a2d1f}
.rte{min-height:180px;max-height:60vh;overflow:auto;border:1px solid var(--line2);border-radius:0 0 12px 12px;background:#110f0c;padding:12px 14px;line-height:1.95;font-size:15.5px;outline:none}
.rte:focus{border-color:var(--gold)}
.rte p{margin:0 0 8px}
.rte ul,.rte ol{margin:4px 0 8px;padding-inline-start:22px}
.rte h3{margin:8px 0 4px;color:var(--gold2);font-size:17px}
.rte:empty:before{content:attr(data-ph);color:#6e6458}
/* images */
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.im{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#1b1612;aspect-ratio:1}
.im img{width:100%;height:100%;object-fit:contain;background:#0f0d0b}
.im .main{position:absolute;top:6px;right:6px;background:var(--gold);color:#1b1209;font-size:10.5px;font-weight:900;border-radius:6px;padding:0 6px}
.im .ctl{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,#000c)}
.im .ctl button{width:30px;height:28px;border-radius:8px;background:#000a;border:1px solid #fff3;color:#fff;font-size:13px}
.add-img{border:1.5px dashed #6b4e2b;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold2);font-weight:800;font-size:12.5px;aspect-ratio:1;cursor:pointer;background:#16110c}
.add-img b{font-size:26px;line-height:1}
/* variants */
.var{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;margin-bottom:8px;align-items:center}
.var button{height:44px;border-radius:10px;background:#2a1513;border:1px solid #6b2a24;color:#ff9b91}
/* faq */
.fq{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.fq .bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.fq .n{width:28px;height:28px;border-radius:9px;background:#2c2015;color:var(--gold2);display:grid;place-items:center;font-weight:900;font-size:13px}
.fq .bar .sp{flex:1}
.fq .bar button{height:32px;min-width:34px;border-radius:9px;border:1px solid var(--line2);background:#1b1612;font-size:13px;padding:0 8px}
.fq textarea{margin-top:8px;min-height:70px}
.fq.hid{opacity:.6}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:min(400px,100%);text-align:center}
.login img{width:120px;height:120px;border-radius:50%;margin-bottom:8px}
.login h1{margin:6px 0 2px;font-size:22px}
.login p{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.login .card{text-align:start}
.err{color:#ff9b91;font-size:13px;margin-top:10px;min-height:1em}
/* misc */
.toast{position:fixed;top:calc(70px + var(--safe-t));left:50%;transform:translate(-50%,-20px);z-index:60;background:#1f2a1f;border:1px solid #3e6b45;color:#d6f5dc;padding:10px 16px;border-radius:13px;font-weight:800;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;max-width:92vw;text-align:center}
.toast.bad{background:#2a1513;border-color:#6b2a24;color:#ffc1ba}
.toast.on{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;z-index:70;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:800}
.busy.on{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #4a3c2b;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pick{position:fixed;inset:0;z-index:50;background:#000c;display:none;align-items:flex-end;justify-content:center}
.pick.on{display:flex}
.pick .in{background:#1a1611;border:1px solid #4d3a26;border-radius:22px 22px 0 0;width:min(640px,100%);max-height:80vh;overflow:auto;padding:16px 14px calc(16px + var(--safe-b))}
.pick .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pick .grid button{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line2);padding:0}
.pick .grid img{width:100%;height:100%;object-fit:cover}
.preview{border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#0f0d0b;aspect-ratio:16/10;margin-bottom:8px}
.preview img{width:100%;height:100%;object-fit:contain}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.ver{text-align:center;color:#6f655a;font-size:11.5px;margin:18px 0 0}
@media (min-width:700px){.imgs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy"><div class="spin"></div><div id="busyT">لحظة...</div></div>
<div class="pick" id="pick" onclick="if(event.target===this)closePick()"><div class="in" id="pickIn"></div></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   لوحة إدارة طابوني برو — تعديل المنتجات، الصور، الأسعار، الأحجام، الأسئلة ونصوص الموقع
   الحماية: Supabase Auth + قواعد RLS (ملف supabase/setup.sql)
   ========================================================= */
const CFG=window.TABOONI_CONFIG||{}, DEF=window.TABOONI_DEFAULTS||{settings:{},products:[],faqs:[]};
const CATS={pizza:'بيتزا',baked:'مخبوزات',meals:'وجبات',workshop:'ورشات'};
const BUCKET='site-images';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₪'+Number(n||0).toLocaleString('en-US');
const clone=o=>JSON.parse(JSON.stringify(o));
let sb=null, P=[], F=[], FDEL=[], ST={}, cur=null, dirty=false, view='products', pickCb=null, fileCb=null;
const app=$('#app');

/* ---------- UI helpers ---------- */
let tT;function toast(t,bad){const e=$('#toast');e.textContent=t;e.classList.toggle('bad',!!bad);e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),bad?4200:2200)}
function busy(on,t){$('#busy').classList.toggle('on',on);$('#busyT').textContent=t||'لحظة...'}
function markDirty(){dirty=true}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function errMsg(e){const m=(e&&(e.message||e.error_description||e.error))||String(e);
  if(/row-level security|permission denied|not allowed/i.test(m))return 'ما في صلاحية — تأكد إنه حسابك مسجّل كأدمن (setup.sql)';
  if(/Failed to fetch|NetworkError/i.test(m))return 'ما في اتصال بالإنترنت أو بـ Supabase';
  return m}

/* تنظيف الوصف (نفس قواعد الموقع) */
function cleanHTML(h){
  const t=document.createElement('template');t.innerHTML=String(h||'');
  const ok={P:1,BR:1,STRONG:1,B:1,EM:1,I:1,U:1,UL:1,OL:1,LI:1,H3:1,H4:1};
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){
      if(/^(SCRIPT|STYLE|IFRAME|META|LINK)$/.test(c.tagName)){c.remove();return}
      walk(c);
      if(c.tagName==='DIV'){const p=document.createElement('p');p.append(...c.childNodes);c.replaceWith(p);return}
      if(!ok[c.tagName]) c.replaceWith(...c.childNodes);
      else [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    } else if(c.nodeType!==3) c.remove();
  })})(t.content);
  return t.innerHTML.replace(/<p>(\s|<br>)*<\/p>/g,'').trim();
}

/* ---------- Boot ---------- */
async function init(){
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase){
    app.innerHTML=`<div class="login"><div class="box"><img src="assets/logo.png" alt=""><h1>لوحة الإدارة</h1>
      <div class="card"><h2>⚙️ الربط مع Supabase لسا مش جاهز</h2><p class="hint">لازم تعبّي <b>supabaseUrl</b> و <b>supabaseAnonKey</b> بملف <b>config.js</b>، وتشغّل ملف <b>supabase/setup.sql</b> مرة وحدة بـ Supabase. التفاصيل بملف README.</p></div></div></div>`;return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session) await afterLogin(); else renderLogin();
}
function renderLogin(msg){
  app.innerHTML=`<div class="login"><div class="box"><img src="assets/logo.png" alt=""><h1>إدارة طابوني برو</h1><p>تعديل المنتجات، الأسعار، الصور ونصوص الموقع</p>
   <form class="card" id="lf"><label class="f"><span>اسم المستخدم</span><input type="text" id="lu" autocomplete="username" autocapitalize="none" dir="ltr" value="ayman"></label>
   <label class="f"><span>كلمة السر</span><input type="password" id="lp" autocomplete="current-password" dir="ltr"></label>
   <button class="btn gold full" style="margin-top:16px" type="submit">دخول</button><div class="err" id="lerr">${esc(msg||'')}</div></form>
   <div class="ver">${esc(CFG.version||'')}</div></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const u=$('#lu').value.trim(),pw=$('#lp').value;if(!u||!pw)return;
    const email=u.includes('@')?u:u+(CFG.loginDomain||'');
    busy(true,'دخول...');const {error}=await sb.auth.signInWithPassword({email,password:pw});busy(false);
    if(error){$('#lerr').textContent=/invalid/i.test(error.message)?'اسم المستخدم أو كلمة السر غلط':errMsg(error);return}
    afterLogin();
  };
}
async function afterLogin(){
  busy(true,'تحميل...');
  const {data:isAdmin,error}=await sb.rpc('is_site_admin');
  if(error){busy(false);await sb.auth.signOut();renderLogin('قاعدة البيانات مش جاهزة — شغّل ملف supabase/setup.sql أول ('+errMsg(error)+')');return}
  if(!isAdmin){busy(false);await sb.auth.signOut();renderLogin('هذا الحساب مش مسجّل كأدمن للموقع');return}
  try{await loadAll()}catch(e){busy(false);toast(errMsg(e),true);return}
  busy(false);go('products',true);
}
async function loadAll(){
  const [p,f,s]=await Promise.all([
    sb.from('site_products').select('*').order('sort',{ascending:true}),
    sb.from('site_faqs').select('*').order('sort',{ascending:true}),
    sb.from('site_settings').select('data').eq('id',1).maybeSingle()]);
  for(const r of [p,f,s]) if(r.error) throw r.error;
  P=p.data||[];F=f.data||[];FDEL=[];ST={...DEF.settings,...((s.data&&s.data.data)||{})};
}
async function logout(){if(dirty&&!confirm('في تغييرات مش محفوظة. تطلع بدون حفظ؟'))return;dirty=false;await sb.auth.signOut();renderLogin()}

/* ---------- Shell ---------- */
function shell(title,body,{back,savebar,tabs}={}){
  app.innerHTML=`<header class="top"><div class="wrap">
      ${back?`<button class="ib" onclick="${back}" aria-label="رجوع">→</button>`:`<img src="assets/logo.png" alt="">`}
      <h1>${esc(title)}<small>إدارة طابوني برو</small></h1>
      <a class="ib" href="./?edit" target="_blank" rel="noopener" aria-label="تعديل مباشر على الموقع" title="تعديل مباشر على الموقع">✎</a>
      <a class="ib" href="./" target="_blank" rel="noopener" aria-label="فتح الموقع" title="فتح الموقع">👁</a>
      <button class="ib" onclick="logout()" aria-label="خروج" title="خروج">⏻</button>
    </div></header>
    <main><div class="wrap">${body}</div></main>
    ${savebar?`<div class="savebar ${tabs?'wt':''}"><div class="wrap">${savebar}</div></div>`:''}
    ${savebar&&!tabs?'':`<div class="tabs"><nav>${[['products','🍕','المنتجات'],['faqs','؟','الأسئلة'],['texts','✎','نصوص الموقع'],['settings','⚙','الإعدادات']].map(([k,i,l])=>`<button class="tab ${view===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</nav></div>`}`;
  document.body.classList.toggle('two-bars',!!(savebar&&tabs));
  window.scrollTo(0,0);
}
function go(v,force){
  if(!force&&dirty&&!confirm('في تغييرات مش محفوظة. تطلع بدون حفظ؟'))return;
  dirty=false;view=v;cur=null;
  ({products:renderProducts,faqs:renderFaqs,texts:renderTexts,settings:renderSettings})[v]();
}

/* ---------- Products list ---------- */
function priceLabel(p){const v=p.variants||[];return v.length?'يبدأ من '+money(Math.min(...v.map(x=>+x.price||0))):money(p.price)}
function renderProducts(){
  const rows=P.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center">
     <button class="pi" onclick="editProduct(${p.id})">
       ${p.images&&p.images[0]?`<img src="${esc(p.images[0].src)}" alt="" loading="lazy">`:`<div class="noimg"></div>`}
       <div class="t"><b>${esc(p.title)}</b><div class="m"><span>${priceLabel(p)}</span><span>· ${CATS[p.category]||''}</span>
         <span class="badge ${p.status==='draft'?'b-off':'b-on'}">${p.status==='draft'?'مخفي':'ظاهر'}</span>${p.featured?'<span class="badge b-feat">★ مختار</span>':''}</div></div>
     </button>
     <div class="mv"><button onclick="moveProduct(${i},-1)" aria-label="لفوق" ${i?'':'disabled'}>▲</button><button onclick="moveProduct(${i},1)" aria-label="لتحت" ${i<P.length-1?'':'disabled'}>▼</button></div>
   </div>`).join('');
  shell('المنتجات',`<div class="head"><h2>المنتجات <small style="color:var(--muted);font-size:13px">${P.length}</small></h2><button class="btn gold" onclick="editProduct(null)">+ منتج جديد</button></div>
    ${P.length?`<div class="plist">${rows}</div><p class="hint">▲▼ لترتيب المنتجات بالموقع. اضغط على منتج لتعديله.</p>`:`<div class="empty">ما في منتجات بعد.<br>شغّلت ملف setup.sql؟ هو بيعبّي المنتجات الحالية.</div>`}

/* ---------- Images: ضغط + رفع ---------- */
function pickFiles(cb){fileCb=cb;const i=$('#fileIn');i.value='';i.click()}
$('#fileIn').onchange=e=>{const f=e.target.files;if(f&&f.length&&fileCb)fileCb(f)};
async function compress(file,max=1400,q=.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('الملف مش صورة مدعومة'));i.src=url});
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('فشل ضغط الصورة')),'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadImage(file){
  const blob=await compress(file);
  const path=`products/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function allImages(){const s=new Set();P.forEach(p=>(p.images||[]).forEach(i=>s.add(i.src)));[ST.hero_image,ST.about_image].forEach(x=>x&&s.add(x));return [...s]}

  <button class="btn gold full" onclick="closePick();pickFiles(async f=>{busy(true,'رفع...');try{const u=await uploadImage(f[0]);pickCb&&pickCb(u)}catch(e){toast(errMsg(e),true)}busy(false)})">⬆ رفع صورة جديدة</button>
  <p class="hint">أو اختار من الصور الموجودة:</p><div class="grid">${allImages().map(u=>`<button onclick='closePick();pickCb(${JSON.stringify(u).replace(/'/g,"&#39;")})'><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>`;

async function saveFaqs(){
  const rows=F.map((f,i)=>({...(f.id?{id:f.id}:{}),q:String(f.q||'').trim(),a:String(f.a||'').trim(),visible:f.visible!==false,sort:i+1,updated_at:new Date().toISOString()}));

  busy(true,'حفظ...');
  try{
    if(FDEL.length){const {error}=await sb.from('site_faqs').delete().in('id',FDEL);if(error)throw error}
    const old=rows.filter(r=>r.id),neu=rows.filter(r=>!r.id);

    const r=await sb.from('site_faqs').select('*').order('sort');if(r.error)throw r.error;F=r.data;FDEL=[];
    dirty=false;busy(false);toast('✓ انحفظت الأسئلة');drawFaqs();

function drawRevs(){ST.reviews=Array.isArray(ST.reviews)?ST.reviews:[];
  $('#revEd').innerHTML=ST.reviews.map((r,i)=>`<div class="fq"><div class="bar"><span class="n">${i+1}</span>
     <select style="width:auto" onchange="ST.reviews[${i}].stars=+this.value;markDirty()">${[5,4,3].map(n=>`<option value="${n}" ${(+r.stars||5)===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select><span class="sp"></span>
     <button onclick="ST.reviews.splice(${i},1);drawRevs();markDirty()" aria-label="حذف">🗑</button></div>
     <input type="text" value="${esc(r.name)}" placeholder="اسم الزبون (مثال: أحمد م.)" oninput="ST.reviews[${i}].name=this.value;markDirty()">
     <textarea placeholder="نص الرأي" oninput="ST.reviews[${i}].text=this.value;markDirty()">${esc(r.text)}</textarea></div>`).join('')}
function addRev(){ST.reviews=Array.isArray(ST.reviews)?ST.reviews:[];ST.reviews.push({name:'',text:'',stars:5});drawRevs();markDirty()}
function renderSettings(){
  shell('الإعدادات',`
   <div class="card"><h2>📞 التواصل والطلبات</h2>
     ${fld('whatsapp','رقم واتساب للطلبات','tel','972526992646','دولي بدون + وبدون 0 بالأول — كل الطلبات بتوصل لهالرقم.')}
     ${fld('phone','رقم للاتصال','tel','+972526992646')}
     ${fld('email','البريد','email')}
     ${fld('instagram','إنستغرام (اسم الحساب)','text','tabooni.pro')}
     ${fld('facebook','رابط فيسبوك','url','https://facebook.com/...')}
     ${fld('location','رابط الموقع على الخريطة (Google Maps / Waze)','url','https://maps.app.goo.gl/...')}
     <button class="btn gold full" style="margin-top:14px" onclick="saveSettings()">💾 حفظ</button></div>
   <div class="card"><h2>🔒 تغيير كلمة السر</h2>
     <label class="f"><span>كلمة سر جديدة (8 أحرف على الأقل)</span><input type="password" id="np" autocomplete="new-password" dir="ltr"></label>
     <button class="btn dark full" style="margin-top:12px" onclick="changePw()">تغيير كلمة السر</button></div>
   <button class="btn danger full" onclick="logout()">⏻ خروج</button>
   <div class="ver">${esc(CFG.version||'')}</div>`);
  bindFields();
}
async function changePw(){const v=$('#np').value;if(v.length<8){toast('كلمة السر لازم تكون 8 أحرف على الأقل',true);return}
  busy(true);const {error}=await sb.auth.updateUser({password:v});busy(false);
  if(error){toast(errMsg(error),true);return}$('#np').value='';toast('✓ تغيّرت كلمة السر')}

init().catch(e=>{busy(false);toast(errMsg(e),true)});
</script>
